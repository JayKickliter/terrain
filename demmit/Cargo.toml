[package]
edition = "2021"
name    = "demmit"
version = "0.0.0"

[lib]
name = "demmit"
path = "src/lib.rs"

[dependencies]
anyhow             = { workspace = true }
camino             = { workspace = true, features = ["serde1"] }
clap               = { workspace = true }
crossbeam-channel  = "0.5.16"
directories        = "6.0.0"
dropclock          = "0.1.0"
eframe             = "0.35.0"
egui               = "0.35.0"
egui_plot          = "0.36"
fastrand           = "2.5.0"
h3o                = { workspace = true }
hextree            = { workspace = true }
image              = { workspace = true }
lru                = "0.18.1"
multiversion       = "0.8.0"
nalgebra           = { workspace = true }
nasadem            = { path = "../nasadem", features = ["image"] }
num-traits         = { workspace = true }
rayon              = "1.12.0"
rfd                = "0.17.2"
serde              = { version = "1.0.229", features = ["derive"] }
terrain            = { version = "0.0.0", path = "../terrain" }
tikv-jemallocator  = "*"
toml               = "1.1.3"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
